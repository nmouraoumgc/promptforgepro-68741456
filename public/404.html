<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Página não encontrada | PromptForge Pro</title>
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script>(function(){var d=true;try{var s=JSON.parse(localStorage.getItem('promptforge-storage')||'null');if(s&&s.state&&typeof s.state.darkMode==='boolean')d=s.state.darkMode;else if(window.matchMedia)d=!window.matchMedia('(prefers-color-scheme: light)').matches;}catch(e){}if(d)document.documentElement.classList.add('dark');})();</script>
<style>
  :root{--bg:#f5f6f8;--fg:#1e2533;--h:#0f121a;--muted:#5b6475;--line:#d5d9e0}
  html.dark{--bg:#0f121a;--fg:#e2e8f0;--h:#fff;--muted:#94a3b8;--line:#334155}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  .box{max-width:440px;text-align:center}
  .code{color:#f97316;font-weight:700;letter-spacing:.05em}
  h1{font-size:28px;margin:8px 0 12px;color:var(--h)}
  p{color:var(--muted);line-height:1.5}
  a{display:inline-block;margin:6px;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:600}
  .primary{background:#f97316;color:#fff}
  .ghost{border:1px solid var(--line);color:var(--fg)}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço pode estar errado ou a página mudou de sítio.<br /><span lang="en">Page not found. The address may be wrong or the page has moved.</span></p>
    <a class="primary" href="/">Voltar ao início</a>
    <a class="ghost" href="/pricing">Ver planos</a>
  </div>
</body>
</html>
