    <script>
      // Apply the saved theme (or the system default) before first paint, so no page flashes white.
      (function () {
        var dark = true;
        try {
          var st = JSON.parse(localStorage.getItem('promptforge-storage') || 'null');
          if (st && st.state && typeof st.state.darkMode === 'boolean') dark = st.state.darkMode;
          else if (window.matchMedia) dark = !window.matchMedia('(prefers-color-scheme: light)').matches;
        } catch (e) {}
        var r = document.documentElement;
        if (dark) r.classList.add('dark'); else r.classList.remove('dark');
        r.style.colorScheme = dark ? 'dark' : 'light';
        // Saved text size (A / A+ / A++), see src/lib/fontSize.ts.
        try {
          var fs = localStorage.getItem('pf_font_size');
          if (fs === 'large' || fs === 'xlarge') r.setAttribute('data-fs', fs);
        } catch (e) {}
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#0f121a' : '#f5f6f8');
        // Web fonts load after the page has rendered (metric-matched fallback below avoids layout shift).
        var loadFonts = function () {
          var f = document.createElement('link');
          f.rel = 'stylesheet';
          f.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap';
          document.head.appendChild(f);
        };
        if (document.readyState === 'complete') loadFonts(); else window.addEventListener('load', loadFonts);
        // Vercel Web Analytics queue stub.
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      })();
    </script>
